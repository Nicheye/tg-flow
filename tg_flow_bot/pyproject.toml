[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-flow"
version = "1.0.0"
description = "TG Flow Telegram mention service, CLI, and MCP server"
requires-python = ">=3.13"
dependencies = [
    "django==6.0",
    "django-cors-headers==4.6.0",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "psycopg2-binary==2.9.10",
    "whitenoise==6.9.0",
    "fastapi==0.141.1",
    "httpx==0.27.2",
    "mcp==2.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-telegram-bot==22.8",
    "tortoise-orm[asyncpg]==0.23.0",
    "typer==0.27.0",
    "uvicorn[standard]==0.41.0",
]

[project.scripts]
tgflow = "tgflow.cli:app"

[tool.setuptools]
py-modules = ["config", "database", "main", "mcp_server", "models", "schemas"]

[tool.setuptools.packages.find]
include = ["auth_project*", "users*", "bot*", "routers*", "services*", "tgflow*"]

[tool.setuptools.package-data]
users = ["templates/oauth/*.html"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "config", "database", "mcp_server", "models", "routers", "schemas", "services", "tgflow"]

[tool.aerich]
tortoise_orm = "database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

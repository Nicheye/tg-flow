# Only the immediate peer may supply the original scheme, and only when its
# address is explicitly listed in TRUSTED_PROXY_RULES.
geo $trusted_proxy {
    default 0;
    ${TRUSTED_PROXY_RULES}
}

map "$trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

# nginx checks the request Host syntax; retain its port for backend allowlists.
# HTTP/1.0 requests without Host use nginx's selected server name instead.
map $http_host $upstream_host {
    default $http_host;
    "" $host;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve request paths and forward the original host to the bot service.
    proxy_set_header Host $upstream_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /mcp {
        proxy_pass ${BOT_API_UPSTREAM};
        proxy_http_version 1.1;
        # proxy_set_header directives are inherited only when none are set here.
        proxy_set_header Host $upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location ^~ /api/ {
        proxy_pass ${BOT_API_UPSTREAM};
    }

    location = /oauth {
        proxy_pass ${BOT_API_UPSTREAM};
    }

    location ^~ /oauth/ {
        proxy_pass ${BOT_API_UPSTREAM};
    }

    location ^~ /.well-known/ {
        proxy_pass ${BOT_API_UPSTREAM};
    }

    # SPA routing - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}


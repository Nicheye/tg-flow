limit_req_zone $binary_remote_addr zone=registration:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tokens:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=authorization:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name tg.mishanya.fun;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://tg.mishanya.fun$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name tg.mishanya.fun;
    ssl_certificate /etc/letsencrypt/live/tg.mishanya.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.mishanya.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;
    if ($host != tg.mishanya.fun) { return 444; }
    # OAuth codes live in query strings. Do not record request URLs or headers.
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/tg-flow-proxy.conf;

    location ~ ^/(oauth/register/?|api/auth/register/?)$ {
        limit_req zone=registration burst=5 nodelay;
        proxy_pass http://172.30.40.3:8081;
    }
    location ~ ^/(oauth/(token|session/(telegram|web))/?|api/auth/(login|telegram-auth|token/refresh)/?)$ {
        limit_req zone=tokens burst=10 nodelay;
        proxy_pass http://172.30.40.3:8081;
    }
    location ~ ^/oauth/authorize(/decision)?/?$ {
        limit_req zone=authorization burst=10 nodelay;
        proxy_pass http://172.30.40.3:8081;
    }
    location = /mcp {
        proxy_pass http://172.30.40.3:8081;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ { proxy_pass http://172.30.40.3:8081; }
    location /oauth/ { proxy_pass http://172.30.40.3:8081; }
    location = /oauth { proxy_pass http://172.30.40.3:8081; }
    location /.well-known/ { proxy_pass http://172.30.40.3:8081; }
    location / { proxy_pass http://172.30.40.4:80; }
}
